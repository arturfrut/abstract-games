<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yubibo - Simulador de Baraja</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/icons-sprite.svg">
  <style>
    .player-card {
      border: 3px solid;
      border-radius: 15px;
      padding: 20px;
      margin: 10px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .game-card {
      width: 200px;
      height: 300px;
      border: 3px solid;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card-icon {
      font-size: 4rem;
      margin-bottom: 15px;
    }

    .card-finger {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .card-hand {
      font-size: 1rem;
      color: #666;
      margin-bottom: 5px;
    }

    .current-turn {
      background-color: #fff3cd;
      border-color: #ffc107 !important;
    }

    .deck-area {
      min-height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .score-display {
      font-size: 2rem;
      font-weight: bold;
      color: #007bff;
    }

    .winner-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .winner-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .color-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 3px solid #333;
      color: white;
      font-weight: bold;
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }

    .color-btn.active {
      border: 5px solid #007bff;
      box-shadow: 0 0 15px rgba(0, 123, 255, 0.6);
      transform: scale(1.1);
    }

    .color-red {
      background-color: #dc3545;
    }

    .color-blue {
      background-color: #007bff;
    }

    .color-green {
      background-color: #28a745;
    }

    .color-yellow {
      background-color: #ffc107;
      color: #333;
    }

    .color-purple {
      background-color: #6f42c1;
    }

    .tabler-icon {
      width: 4rem;
      height: 4rem;
      stroke-width: 1.5;
    }

    #deckPlaceholder {
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Yubibo - Simulador de Baraja</h1>

    <!-- Pantalla inicial -->
    <div id="startScreen" class="text-center">
      <button id="startGameBtn" class="btn btn-primary btn-lg">Iniciar Juego</button>
    </div>

    <!-- Configuración del juego -->
    <div id="setupScreen" class="d-none">
      <div class="text-center mb-4">
        <h3>¿Cuántos jugadores?</h3>
        <div class="d-flex justify-content-center gap-3 mb-4">
          <button class="color-btn color-red" data-players="2">2</button>
          <button class="color-btn color-blue" data-players="3">3</button>
          <button class="color-btn color-green" data-players="4">4</button>
          <button class="color-btn color-yellow" data-players="5">5</button>
        </div>

        <h3>Modo de juego</h3>
        <div class="d-flex justify-content-center gap-3 mb-4">
          <button id="oneHandBtn" class="btn btn-outline-primary active">UNA mano</button>
          <button id="twoHandsBtn" class="btn btn-outline-primary">DOS manos</button>
        </div>

        <button id="beginGameBtn" class="btn btn-success btn-lg" disabled>Comenzar</button>
      </div>
    </div>

    <!-- Pantalla de juego -->
    <div id="gameScreen" class="d-none">
      <div class="row mb-4">
        <div class="col-md-4">
          <div class="card">
            <div class="card-header">
              <h5>Jugadores</h5>
            </div>
            <div class="card-body" id="playersList">
              <!-- Los jugadores se generan dinámicamente -->
            </div>
          </div>
        </div>
        <div class="col-md-4 text-center">
          <div class="card">
            <div class="card-header">
              <h5>Puntuación</h5>
            </div>
            <div class="card-body">
              <div class="score-display" id="scoreDisplay">0</div>
            </div>
          </div>
          <div class="mt-3">
            <p><strong>Modo:</strong> <span id="gameModeDisplay"></span></p>
            <p><strong>Cartas restantes:</strong> <span id="cardsRemaining">0</span></p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <div class="card-header">
              <h5>Controles</h5>
            </div>
            <div class="card-body text-center">
              <button id="drawCardBtn" class="btn btn-primary btn-lg mb-2">Repartir</button>
              <br>
              <button id="resetGameBtn" class="btn btn-secondary">Reiniciar</button>
            </div>
          </div>
        </div>
      </div>

      <div class="deck-area">
        <div id="currentCard" class="d-none">
          <!-- La carta actual se muestra aquí -->
        </div>
        <div id="deckPlaceholder" class="text-center">
          <svg class="tabler-icon" style="color: #ccc;">
            <use href="#tabler-stack-2"></use>
          </svg>
          <p class="text-muted mt-3">Haz click en "Repartir" para sacar una carta</p>
        </div>
      </div>
    </div>

    <!-- Modal de victoria -->
    <div id="winnerModal" class="winner-modal d-none">
      <div class="winner-content">
        <h2 class="text-success mb-3">¡Ganaste!</h2>
        <p class="mb-4">Has completado todas las cartas exitosamente.</p>
        <div class="d-flex justify-content-center gap-3">
          <button id="restartGameBtn" class="btn btn-primary">Volver a empezar</button>
          <button id="newRoundBtn" class="btn btn-success">Nueva ronda</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabler Icons SVG Sprite -->
  <svg style="display: none;">
    <symbol id="tabler-stack-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
    </symbol>
    <symbol id="tabler-thumb-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path
        d="M7 11v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3a4 4 0 0 0 4-4V6a2 2 0 0 1 4 0v5h3a2 2 0 0 1 2 2l-1 5a2 3 0 0 1-2 2h-7a3 3 0 0 1-3-3" />
    </symbol>
    <symbol id="tabler-hand-finger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 13v-8.5a1.5 1.5 0 0 1 3 0v7.5" />
      <path d="M11 11.5v-2a1.5 1.5 0 1 1 3 0v2.5" />
      <path d="M14 10.5a1.5 1.5 0 0 1 3 0v1.5" />
      <path
        d="M17 11.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7a69.74 69.74 0 0 1 -.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47" />
    </symbol>
    <symbol id="tabler-hand-middle-finger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 13v-2.5a1.5 1.5 0 0 1 3 0v1.5" />
      <path d="M11 11.5v-8a1.5 1.5 0 1 1 3 0v8.5" />
      <path d="M14 10.5a1.5 1.5 0 0 1 3 0v1.5" />
      <path
        d="M17 11.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7a69.74 69.74 0 0 1 -.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47" />
    </symbol>
    <symbol id="tabler-hand-ring-finger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 13v-2.5a1.5 1.5 0 0 1 3 0v1.5" />
      <path d="M11 11.5v-2a1.5 1.5 0 1 1 3 0v2.5" />
      <path d="M14 10.5v-7a1.5 1.5 0 1 1 3 0v8.5" />
      <path
        d="M17 11.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7a69.74 69.74 0 0 1 -.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47" />
    </symbol>
    <symbol id="tabler-hand-little-finger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 13v-2.5a1.5 1.5 0 0 1 3 0v1.5" />
      <path d="M11 11.5v-2a1.5 1.5 0 1 1 3 0v2.5" />
      <path d="M14 10.5a1.5 1.5 0 0 1 3 0v1.5" />
      <path
        d="M17 11.5v-6a1.5 1.5 0 1 1 3 0v10.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7a69.74 69.74 0 0 1 -.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47" />
    </symbol>
  </svg>

  <script>
    class YubiboGame {
      constructor() {
        this.players = 2;
        this.gameMode = 'one'; // 'one' or 'two'
        this.deck = [];
        this.currentTurn = 0;
        this.score = 0;
        this.playerColors = ['red', 'blue', 'green', 'yellow', 'purple'];
        this.fingers = ['pulgar', 'índice', 'mayor', 'anular', 'meñique'];
        this.fingerIcons = {
          'pulgar': 'tabler-thumb-up',
          'índice': 'tabler-hand-finger',
          'mayor': 'tabler-hand-middle-finger',
          'anular': 'tabler-hand-ring-finger',
          'meñique': 'tabler-hand-little-finger'
        };

        this.initEventListeners();
      }

      initEventListeners() {
        // Botón iniciar juego
        document.getElementById('startGameBtn').addEventListener('click', () => {
          this.showSetupScreen();
        });

        // Selección de jugadores
        document.querySelectorAll('[data-players]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('[data-players]').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            this.players = parseInt(e.target.dataset.players);
            this.checkBeginButton();
          });
        });

        // Selección de modo de juego
        document.getElementById('oneHandBtn').addEventListener('click', () => {
          this.selectGameMode('one');
        });

        document.getElementById('twoHandsBtn').addEventListener('click', () => {
          this.selectGameMode('two');
        });

        // Comenzar juego
        document.getElementById('beginGameBtn').addEventListener('click', () => {
          this.startGame();
        });

        // Repartir carta
        document.getElementById('drawCardBtn').addEventListener('click', () => {
          this.drawCard();
        });

        // Reiniciar juego
        document.getElementById('resetGameBtn').addEventListener('click', () => {
          this.resetToSetup();
        });

        // Botones del modal de victoria
        document.getElementById('restartGameBtn').addEventListener('click', () => {
          this.restartGame();
        });

        document.getElementById('newRoundBtn').addEventListener('click', () => {
          this.newRound();
        });

        document.getElementById('deckPlaceholder').addEventListener('click', () => {
          this.drawCard();
        });

      }

      showSetupScreen() {
        document.getElementById('startScreen').classList.add('d-none');
        document.getElementById('setupScreen').classList.remove('d-none');
        // Seleccionar por defecto 2 jugadores
        document.querySelector('[data-players="2"]').classList.add('active');
        this.players = 2;
        this.checkBeginButton();
      }

      selectGameMode(mode) {
        this.gameMode = mode;
        document.getElementById('oneHandBtn').classList.remove('active');
        document.getElementById('twoHandsBtn').classList.remove('active');

        if (mode === 'one') {
          document.getElementById('oneHandBtn').classList.add('active');
        } else {
          document.getElementById('twoHandsBtn').classList.add('active');
        }

        this.checkBeginButton();
      }

      checkBeginButton() {
        const hasPlayers = this.players > 0;
        const hasMode = this.gameMode !== null;
        document.getElementById('beginGameBtn').disabled = !(hasPlayers && hasMode);
      }

      startGame() {
        this.createDeck();
        this.currentTurn = 0;
        this.updateGameScreen();

        document.getElementById('setupScreen').classList.add('d-none');
        document.getElementById('gameScreen').classList.remove('d-none');
      }

      createDeck() {
        this.deck = [];
        const cardsPerPlayer = this.gameMode === 'one' ? 5 : 10;

        for (let player = 0; player < this.players; player++) {
          const playerColor = this.playerColors[player];

          if (this.gameMode === 'one') {
            // Una mano - 5 cartas por jugador
            for (let finger = 0; finger < 5; finger++) {
              this.deck.push({
                player: player,
                color: playerColor,
                finger: this.fingers[finger],
                hand: null
              });
            }
          } else {
            // Dos manos - 10 cartas por jugador
            for (let hand of ['izquierda', 'derecha']) {
              for (let finger = 0; finger < 5; finger++) {
                this.deck.push({
                  player: player,
                  color: playerColor,
                  finger: this.fingers[finger],
                  hand: hand
                });
              }
            }
          }
        }

        // Mezclar el mazo
        this.shuffleDeck();
      }

      shuffleDeck() {
        for (let i = this.deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [this.deck[i], this.deck[j]] = [this.deck[j], this.deck[i]];
        }
      }

      updateGameScreen() {
        this.updatePlayersList();
        this.updateGameInfo();
        this.updateScore();
        this.updateCardsRemaining();
      }

      updatePlayersList() {
        const playersList = document.getElementById('playersList');
        playersList.innerHTML = '';

        for (let i = 0; i < this.players; i++) {
          const playerDiv = document.createElement('div');
          playerDiv.className = `player-card color-${this.playerColors[i]}`;
          if (i === this.currentTurn) {
            playerDiv.classList.add('current-turn');
          }
          playerDiv.innerHTML = `
                        <strong>Jugador ${i + 1}</strong>
                        ${i === this.currentTurn ? '<br><small>Turno actual</small>' : ''}
                    `;
          playersList.appendChild(playerDiv);
        }
      }

      updateGameInfo() {
        const modeText = this.gameMode === 'one' ? 'UNA mano' : 'DOS manos';
        document.getElementById('gameModeDisplay').textContent = modeText;
      }

      updateScore() {
        document.getElementById('scoreDisplay').textContent = this.score;
      }

      updateCardsRemaining() {
        document.getElementById('cardsRemaining').textContent = this.deck.length;
      }

      drawCard() {
        if (this.deck.length === 0) {
          this.showWinnerModal();
          return;
        }

        const card = this.deck.pop();
        this.score++;
        this.currentTurn = (this.currentTurn + 1) % this.players;

        this.showCard(card);
        this.updateGameScreen();

        if (this.deck.length === 0) {
          setTimeout(() => this.showWinnerModal(), 1000);
        }
      }

      showCard(card) {
        const currentCardDiv = document.getElementById('currentCard');
        const deckPlaceholder = document.getElementById('deckPlaceholder');

        deckPlaceholder.classList.add('d-none');
        currentCardDiv.classList.remove('d-none');

        const colorClass = `color-${card.color}`;
        const fingerIcon = this.fingerIcons[card.finger];

        currentCardDiv.innerHTML = `
                    <div class="game-card ${colorClass}">
                        <svg class="tabler-icon card-icon">
                            <use href="#${fingerIcon}"></use>
                        </svg>
                        <div class="card-finger">${card.finger}</div>
                        ${card.hand ? `<div class="card-hand">Mano ${card.hand}</div>` : ''}
                        <div class="mt-2">
                            <strong>Jugador ${card.player + 1}</strong>
                        </div>
                    </div>
                `;
      }

      showWinnerModal() {
        document.getElementById('winnerModal').classList.remove('d-none');
      }

      hideWinnerModal() {
        document.getElementById('winnerModal').classList.add('d-none');
      }

      restartGame() {
        this.score = 0;
        this.hideWinnerModal();
        this.resetToSetup();
      }

      newRound() {
        this.hideWinnerModal();
        this.createDeck();
        this.currentTurn = 0;
        this.updateGameScreen();

        // Limpiar carta actual
        document.getElementById('currentCard').classList.add('d-none');
        document.getElementById('deckPlaceholder').classList.remove('d-none');
      }

      resetToSetup() {
        this.score = 0;
        this.players = 2;
        this.gameMode = 'one';
        this.deck = [];
        this.currentTurn = 0;

        document.getElementById('gameScreen').classList.add('d-none');
        document.getElementById('setupScreen').classList.remove('d-none');

        // Resetear selecciones
        document.querySelectorAll('[data-players]').forEach(btn => btn.classList.remove('active'));
        document.querySelector('[data-players="2"]').classList.add('active');
        document.getElementById('oneHandBtn').classList.add('active');
        document.getElementById('twoHandsBtn').classList.remove('active');

        this.checkBeginButton();
      }
    }

    // Inicializar el juego cuando se carga la página
    document.addEventListener('DOMContentLoaded', () => {
      new YubiboGame();
    });
  </script>
</body>

</html>
